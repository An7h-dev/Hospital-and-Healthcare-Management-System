<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in — MediCare+</title>
  <meta name="description" content="Sign in to MediCare+, the accessibility-first hospital and healthcare management system.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="css/style.css" rel="stylesheet">
  <link href="css/theme-dark.css" rel="stylesheet">
  <link href="css/theme-contrast.css" rel="stylesheet">
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>

  <div class="auth-wrap">
    <main id="main-content" class="auth-card" role="main">
      <div class="text-center mb-3">
        <div class="d-inline-flex align-items-center justify-content-center rounded-3 mb-2"
             style="width:56px;height:56px;background:var(--brand);color:#fff;">
          <i class="bi bi-heart-pulse-fill fs-3"></i>
        </div>
        <h1 class="h3 mb-1">Welcome to MediCare+</h1>
        <p class="text-muted-2 mb-0">Sign in to your account to continue</p>
      </div>

      <div class="d-flex justify-content-center align-items-center gap-2 mb-4 flex-wrap">
        <span class="d-none d-md-flex align-items-center gap-1 text-muted-2">
          <i class="bi bi-circle-half" aria-hidden="true"></i> Theme:
        </span>
        <div class="btn-group btn-group-sm" role="group" aria-label="Theme options">
          <button class="btn btn-outline-primary" type="button" onclick="setTheme('light')">Light</button>
          <button class="btn btn-outline-primary" type="button" onclick="setTheme('dark')">Dark</button>
          <button class="btn btn-outline-primary" type="button" onclick="setTheme('contrast')">High contrast</button>
        </div>
      </div>

      <ul class="nav nav-pills nav-fill mb-4" role="tablist" aria-label="Sign in options">
        <li class="nav-item" role="presentation">
          <button class="nav-link active" id="signin-tab" data-bs-toggle="pill" data-bs-target="#signin" type="button" role="tab" aria-controls="signin" aria-selected="true">Sign in</button>
        </li>
        <li class="nav-item" role="presentation">
          <button class="nav-link" id="signup-tab" data-bs-toggle="pill" data-bs-target="#signup" type="button" role="tab" aria-controls="signup" aria-selected="false">Sign up</button>
        </li>
      </ul>

      <div class="tab-content">
        <div class="tab-pane fade show active" id="signin" role="tabpanel" aria-labelledby="signin-tab" tabindex="0">
          <form>
            <div class="mb-3">
              <label class="form-label required" for="email">Email address</label>
              <input type="email" class="form-control" id="email" placeholder="name@example.com" required>
            </div>
            <div class="mb-1">
              <label class="form-label required" for="password">Password</label>
              <input type="password" class="form-control" id="password" placeholder="Your password" required>
            </div>
            <div class="d-flex justify-content-between align-items-center mb-3">
              <div class="form-check">
                <input class="form-check-input" type="checkbox" id="remember">
                <label class="form-check-label" for="remember">Remember me</label>
              </div>
              <a href="#">Forgot password?</a>
            </div>
            <div class="mb-3">
              <label class="form-label required" for="role">Sign in as</label>
              <select class="form-select" id="role">
                <option value="admin">Administrator</option>
                <option value="doctor">Doctor</option>
                <option value="reception">Receptionist</option>
                <option value="patient">Patient</option>
              </select>
            </div>
            <a class="btn btn-primary w-100" href="index.html" role="button">Sign in</a>
          </form>
        </div>

        <div class="tab-pane fade" id="signup" role="tabpanel" aria-labelledby="signup-tab" tabindex="0">
          <form>
            <div class="mb-3">
              <label class="form-label required" for="reg-name">Full name</label>
              <input type="text" class="form-control" id="reg-name" placeholder="Jane Doe" required>
            </div>
            <div class="mb-3">
              <label class="form-label required" for="reg-email">Email address</label>
              <input type="email" class="form-control" id="reg-email" placeholder="name@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label required" for="reg-pass">Password</label>
              <input type="password" class="form-control" id="reg-pass" placeholder="Create a password" required>
              <div class="form-text help">Minimum 8 characters, with a number and a symbol.</div>
            </div>
            <div class="mb-3">
              <label class="form-label" for="reg-role">I am a</label>
              <select class="form-select" id="reg-role">
                <option value="patient">Patient</option>
                <option value="doctor">Doctor</option>
                <option value="reception">Receptionist</option>
              </select>
            </div>
            <button type="submit" class="btn btn-primary w-100">Create account</button>
          </form>
        </div>
      </div>

      <p class="text-center text-muted-2 mt-4 mb-0" style="font-size:0.8rem;">
        <i class="bi bi-universal-access" aria-hidden="true"></i>
        MediCare+ is built to WCAG 2.1 AA — usable by keyboard and screen reader.
      </p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    (function () {
      var t = localStorage.getItem('mc-theme');
      if (t && t !== 'light') document.documentElement.setAttribute('data-theme', t);
      var f = localStorage.getItem('mc-fs');
      if (f) document.documentElement.style.fontSize = f + 'px';
      window.setTheme = function (t) {
        if (t === 'light') { document.documentElement.removeAttribute('data-theme'); }
        else { document.documentElement.setAttribute('data-theme', t); }
        localStorage.setItem('mc-theme', t);
      };
    })();
  </script>
</body>
</html>
